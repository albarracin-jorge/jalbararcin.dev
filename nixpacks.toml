# Railway / nixpacks build config.
# pnpm is provided through corepack (which places its shim on PATH, unlike a
# global npm install in this image where $NIXPACKS_PATH is undefined).
# COREPACK_INTEGRITY_KEYS=0 disables signature verification, working around the
# outdated npm signing keys bundled with the image's corepack ("Cannot find
# matching keyid" when installing recent pnpm releases).
[variables]
COREPACK_INTEGRITY_KEYS = "0"

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = [
  "corepack enable",
  "corepack prepare pnpm@11.20.0 --activate",
  "pnpm install --frozen-lockfile",
]

[phases.build]
cmds = ["pnpm run build"]

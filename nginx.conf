# Language picked from Accept-Language: Spanish only when it is the browser's first choice; English (the
# default locale) otherwise, including when the header is missing.
map $http_accept_language $site_lang {
    default en;
    "~*^\s*es" es;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects are built from the internal scheme/port, which is wrong behind Coolify's proxy
    # (it would send https visitors to http). Relative Location headers avoid that.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # The response depends on the header, so shared caches must not reuse it across languages.
    location = / {
        add_header Vary Accept-Language always;
        return 302 /$site_lang/;
    }

    # Astro fingerprints everything under /_astro, so it can be cached indefinitely.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
